name: Daily Budget Search

permissions:
  contents: write

on:
  # Automatinis paleidimas kasdien 6:00 UTC (8:00 / 9:00 Lietuvos laiku)
  schedule:
    - cron: '0 6 * * *'
  
  # Rankinis paleidimas bet kada
  workflow_dispatch:

jobs:
  search-budgets:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run budget search
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          python main.py

      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add reports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update: budget report $(date -u +%Y-%m-%d)" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
